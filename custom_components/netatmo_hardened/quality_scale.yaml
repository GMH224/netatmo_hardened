# Netatmo (hardened fork) - quality scale self-assessment
#
# [hardened-fork] This file was corrected in 0.1.0. The version inherited from
# upstream asserted `config-flow-test-coverage: done`, `test-before-setup: done`
# and `config-flow: done` while the distributed archive contained no test suite
# at all. In an ICS context an untrue conformance attestation is a more serious
# defect than most code faults, because every downstream review inherits it.
#
# Rules are marked `done` only where evidence exists in this repository. Where
# a rule is met by a test, the test is named. See docs/VERIFICATION_REPORT.md
# for what was executed and what was not.

rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: partial
    comment: >-
      tests/integration/test_config_flow.py covers the reauth path and the
      public weather options flow. Full branch coverage of the OAuth flow is
      not yet present. Corrected from an unsubstantiated `done` in 0.1.0.
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: Integration does not register custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not register custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >-
      The integration is set up via an OAuth2 flow that has no user-entered
      connection parameters to validate before configuration.
  test-before-setup:
    status: partial
    comment: >-
      Setup surfaces ConfigEntryAuthFailed / ConfigEntryNotReady via the OAuth2
      helper (HA 2026.10 semantics) and validates granted scopes. Covered by
      tests/integration/test_init.py. Corrected from `done` in 0.1.0.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: partial
    comment: >-
      Two-tier suite. Tier 1 (tests/unit/) is executed and green: 124 tests.
      Tier 2 (tests/integration/) requires a Home Assistant runtime and has
      NOT yet been executed - see docs/VERIFICATION_REPORT.md section 4.1.
      That gap is the direct cause of the E-001/E-002 regressions fixed in
      0.1.1 and is stated here rather than rounded up to `done`.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: todo
  discovery: todo
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: done
    comment: >-
      Added in 0.1.0: partial_oauth_scopes, watchdog_reload_exhausted and the
      deprecated webhook action notices.
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
